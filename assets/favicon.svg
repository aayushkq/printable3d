<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer circle and Orange Brand Ring -->
  <circle cx="32" cy="32" r="30.5" fill="#000000" stroke="#F25F01" stroke-width="2.5"/>
  <!-- 3D Printer Gantry -->
  <path d="M19 31V19C19 16.8 20.8 15 23 15H41C43.2 15 45 16.8 45 19V31" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Extruder Nozzle -->
  <path d="M28 15H36V18L32 21L28 18V15Z" fill="#FFFFFF"/>
  <path d="M32 21V24" stroke="#F25F01" stroke-width="2" stroke-linecap="round"/>
  <!-- Isometric 3D Cube Top Face (Orange Filament Pool) -->
  <polygon points="32,24 42,28.5 32,33 22,28.5" fill="#F25F01" stroke="#FFFFFF" stroke-width="1.2"/>
  <!-- Cube Left Face with '3' -->
  <polygon points="22,28.5 32,33 32,45 22,40.5" fill="#000000" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="24.5" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="7.5" fill="#FFFFFF">3</text>
  <!-- Cube Right Face with 'D' -->
  <polygon points="32,33 42,28.5 42,40.5 32,45" fill="#000000" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="34.5" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="7.5" fill="#FFFFFF">D</text>
  <!-- Lower Arc Swoosh -->
  <path d="M18 50C25 53.5 39 53.5 46 50" stroke="#F25F01" stroke-width="1.8" stroke-linecap="round"/>
</svg>
